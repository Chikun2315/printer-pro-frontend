<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Printer Pro - Create Account</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

</head>


<body style="
    margin: 0;
    padding: 0;

    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(
            circle at top right,
            rgba(8,100,207,0.10),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #eef5ff,
            #f7f9fc
        );
">


<!-- =====================================================
     PAGE CONTAINER
===================================================== -->

<div style="
    min-height: 100vh;

    width: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px 15px;

    box-sizing: border-box;
">


<!-- =====================================================
     CREATE ACCOUNT CARD
===================================================== -->

<div style="
    width: 100%;
    max-width: 440px;

    background: rgba(255,255,255,0.98);

    border-radius: 28px;

    padding: 32px 30px 27px;

    box-sizing: border-box;

    position: relative;

    overflow: hidden;

    border: 1px solid rgba(8,100,207,0.08);

    box-shadow:
        0 25px 60px rgba(18,48,90,0.14),
        0 5px 18px rgba(18,48,90,0.06);
">


<!-- TOP GRADIENT -->

<div style="
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 6px;

    background:
        linear-gradient(
            90deg,
            #063b7a,
            #0864cf,
            #1680e8,
            #063b7a
        );
"></div>


<!-- =====================================================
     HEADER
===================================================== -->

<div style="
    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 25px;
">


<a href="login.html"
   style="
        width: 42px;
        height: 42px;

        display: flex;

        align-items: center;
        justify-content: center;

        background: #f1f6fd;

        color: #0864cf;

        border-radius: 13px;

        text-decoration: none;

        border: 1px solid #e2ebf7;

        box-shadow: 0 5px 12px rgba(8,100,207,0.07);
   ">

    <i class="bi bi-arrow-left"
       style="
            font-size: 19px;
       ">
    </i>

</a>


<div>

    <h2 style="
        margin: 0;

        font-size: 23px;

        font-weight: 800;

        letter-spacing: -0.3px;

        color: #172033;
    ">
        Create Account
    </h2>


    <p style="
        margin: 4px 0 0;

        font-size: 12px;

        color: #7a8496;
    ">
        Register for Printer Pro
    </p>

</div>

</div>


<!-- =====================================================
     MODERN ACCOUNT ICON
===================================================== -->

<div style="
    text-align: center;

    margin-bottom: 25px;
">


<div style="
    width: 76px;
    height: 76px;

    margin: 0 auto 13px;

    border-radius: 23px;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            145deg,
            #eaf4ff,
            #dcecff
        );

    color: #0864cf;

    border: 1px solid #d8e9fc;

    box-shadow:
        0 12px 25px rgba(8,100,207,0.13);
">

    <i class="bi bi-person-plus-fill"
       style="
            font-size: 34px;
       ">
    </i>

</div>


<div style="
    font-size: 11px;

    font-weight: 700;

    color: #0864cf;

    letter-spacing: 1px;

    text-transform: uppercase;
">
    Join Printer Pro
</div>

</div>


<!-- =====================================================
     FULL NAME
===================================================== -->

<div style="
    margin-bottom: 17px;
">

<label style="
    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    font-weight: 700;

    color: #30394a;
">
    Full Name
</label>


<div style="
    position: relative;
">


<i class="bi bi-person"
   style="
        position: absolute;

        left: 14px;
        top: 50%;

        transform: translateY(-50%);

        color: #718096;

        font-size: 17px;

        z-index: 2;
   ">
</i>


<input
    type="text"
    id="fullName"
    placeholder="Enter your full name"

    style="
        width: 100%;
        height: 49px;

        border: 1px solid #dce4ee;

        border-radius: 13px;

        padding: 0 14px 0 43px;

        font-size: 14px;

        color: #172033;

        background: #fbfdff;

        outline: none;

        box-sizing: border-box;

        transition: 0.2s ease;
    "
>

</div>

</div>


<!-- =====================================================
     MOBILE
===================================================== -->

<div style="
    margin-bottom: 17px;
">

<label style="
    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    font-weight: 700;

    color: #30394a;
">
    Mobile Number
</label>


<div style="
    position: relative;
">


<i class="bi bi-phone"
   style="
        position: absolute;

        left: 14px;
        top: 50%;

        transform: translateY(-50%);

        color: #718096;

        font-size: 17px;

        z-index: 2;
   ">
</i>


<input
    type="tel"
    id="mobile"

    maxlength="10"

    placeholder="Enter 10-digit mobile number"

    style="
        width: 100%;
        height: 49px;

        border: 1px solid #dce4ee;

        border-radius: 13px;

        padding: 0 14px 0 43px;

        font-size: 14px;

        background: #fbfdff;

        outline: none;

        box-sizing: border-box;
    "
>

</div>

</div>


<!-- =====================================================
     EMAIL
===================================================== -->

<div style="
    margin-bottom: 17px;
">

<label style="
    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    font-weight: 700;

    color: #30394a;
">
    Email Address
</label>


<div style="
    position: relative;
">


<i class="bi bi-envelope"
   style="
        position: absolute;

        left: 14px;
        top: 50%;

        transform: translateY(-50%);

        color: #718096;

        font-size: 16px;

        z-index: 2;
   ">
</i>


<input
    type="email"
    id="email"

    placeholder="Enter your email"

    style="
        width: 100%;
        height: 49px;

        border: 1px solid #dce4ee;

        border-radius: 13px;

        padding: 0 14px 0 43px;

        font-size: 14px;

        background: #fbfdff;

        outline: none;

        box-sizing: border-box;
    "
>

</div>

</div>


<!-- =====================================================
     PASSWORD
===================================================== -->

<div style="
    margin-bottom: 17px;
">

<label style="
    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    font-weight: 700;

    color: #30394a;
">
    Password
</label>


<div style="
    position: relative;
">


<i class="bi bi-shield-lock"
   style="
        position: absolute;

        left: 14px;
        top: 50%;

        transform: translateY(-50%);

        color: #718096;

        font-size: 17px;

        z-index: 2;
   ">
</i>


<input
    type="password"
    id="password"

    placeholder="Create a password"

    style="
        width: 100%;
        height: 49px;

        border: 1px solid #dce4ee;

        border-radius: 13px;

        padding: 0 45px 0 43px;

        font-size: 14px;

        background: #fbfdff;

        outline: none;

        box-sizing: border-box;
    "
>


<button
    type="button"

    onclick="togglePassword()"

    style="
        position: absolute;

        right: 10px;
        top: 50%;

        transform: translateY(-50%);

        border: none;

        background: transparent;

        color: #7c8799;

        padding: 5px;

        cursor: pointer;
    "
>

    <i
        id="passwordIcon"
        class="bi bi-eye"
        style="font-size: 17px;">
    </i>

</button>

</div>

</div>


<!-- =====================================================
     CONFIRM PASSWORD
===================================================== -->

<div style="
    margin-bottom: 18px;
">

<label style="
    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    font-weight: 700;

    color: #30394a;
">
    Confirm Password
</label>


<div style="
    position: relative;
">


<i class="bi bi-shield-check"
   style="
        position: absolute;

        left: 14px;
        top: 50%;

        transform: translateY(-50%);

        color: #718096;

        font-size: 17px;

        z-index: 2;
   ">
</i>


<input
    type="password"
    id="confirmPassword"

    placeholder="Confirm your password"

    style="
        width: 100%;
        height: 49px;

        border: 1px solid #dce4ee;

        border-radius: 13px;

        padding: 0 14px 0 43px;

        font-size: 14px;

        background: #fbfdff;

        outline: none;

        box-sizing: border-box;
    "
>

</div>

</div>


<!-- =====================================================
     ERROR
===================================================== -->

<div
    id="registerError"

    style="
        display: none;

        padding: 11px 13px;

        margin-bottom: 15px;

        border-radius: 11px;

        background: #fff1f1;

        border: 1px solid #ffd8d8;

        color: #dc3545;

        font-size: 12px;

        text-align: center;
    "
>
</div>


<!-- =====================================================
     CREATE ACCOUNT BUTTON
===================================================== -->

<button
    type="button"

    onclick="registerUser()"

    style="
        width: 100%;

        height: 54px;

        border: none;

        border-radius: 14px;

        background:
            linear-gradient(
                135deg,
                #0864cf 0%,
                #0754b7 50%,
                #063b82 100%
            );

        color: #ffffff;

        font-size: 15px;

        font-weight: 700;

        cursor: pointer;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 9px;

        box-shadow:
            0 10px 25px rgba(7,84,183,0.25);

        transition: 0.2s ease;
    "

    onmouseover="
        this.style.transform='translateY(-2px)';
        this.style.boxShadow='0 14px 30px rgba(7,84,183,0.32)';
    "

    onmouseout="
        this.style.transform='translateY(0)';
        this.style.boxShadow='0 10px 25px rgba(7,84,183,0.25)';
    "
>

    <i class="bi bi-person-check-fill"
       style="font-size: 17px;">
    </i>

    <span>
        Create Account
    </span>

    <i class="bi bi-arrow-right"
       style="font-size: 17px;">
    </i>

</button>


<!-- =====================================================
     LOGIN LINK
===================================================== -->

<div style="
    text-align: center;

    margin-top: 20px;

    font-size: 13px;

    color: #7a8496;
">

    Already have an account?

    <a
        href="login.html"

        style="
            color: #0864cf;

            font-weight: 700;

            text-decoration: none;

            margin-left: 4px;
        "
    >
        Login
    </a>

</div>


<!-- =====================================================
     SECURITY
===================================================== -->

<div style="
    margin-top: 19px;

    padding-top: 16px;

    border-top: 1px solid #edf1f6;

    text-align: center;

    font-size: 10px;

    color: #9aa3b2;
">

    <i
        class="bi bi-shield-check"
        style="
            color: #0874dc;

            margin-right: 4px;
        "
    >
    </i>

    Your information is secure with Printer Pro

</div>


</div>

</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


/* =====================================================
   PASSWORD TOGGLE
===================================================== */

function togglePassword() {

    const password =
        document.getElementById("password");

    const icon =
        document.getElementById("passwordIcon");


    if (password.type === "password") {

        password.type = "text";

        icon.className =
            "bi bi-eye-slash";

    } else {

        password.type = "password";

        icon.className =
            "bi bi-eye";

    }

}


/* =====================================================
   REGISTRATION
===================================================== */

function registerUser() {

    const name =
        document
        .getElementById("fullName")
        .value
        .trim();


    const mobile =
        document
        .getElementById("mobile")
        .value
        .trim();


    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;


    const error =
        document
        .getElementById("registerError");


    error.style.display = "none";


    /* REQUIRED FIELDS */

    if (
        !name ||
        !mobile ||
        !email ||
        !password ||
        !confirmPassword
    ) {

        error.innerText =
            "Please fill in all the fields.";

        error.style.display = "block";

        return;
    }


    /* MOBILE VALIDATION */

    if (!/^[0-9]{10}$/.test(mobile)) {

        error.innerText =
            "Please enter a valid 10-digit mobile number.";

        error.style.display = "block";

        return;
    }


    /* PASSWORD LENGTH */

    if (password.length < 6) {

        error.innerText =
            "Password must contain at least 6 characters.";

        error.style.display = "block";

        return;
    }


    /* PASSWORD MATCH */

    if (password !== confirmPassword) {

        error.innerText =
            "Passwords do not match.";

        error.style.display = "block";

        return;
    }


    /*
        TEMPORARY FRONTEND REGISTRATION

        Backend integration will be added later.
    */

    localStorage.setItem(
        "printerProUser",

        JSON.stringify({

            name: name,

            mobile: mobile,

            email: email

        })
    );


    alert("Registration successful!");


    window.location.href =
        "login.html";

}

</script>


</body>

</html>
