<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Printer Pro - Printer Parts</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

</head>


<body style="
    margin:0;
    padding:0;
    background:#f5f8fc;
    font-family:Arial, Helvetica, sans-serif;
    color:#071b3a;
">


<!-- =====================================================
     MAIN CONTAINER
===================================================== -->

<div style="
    width:100%;
    max-width:504px;
    margin:0 auto;
    min-height:100vh;
    padding:20px 20px 100px 20px;
    box-sizing:border-box;
">


    <!-- =================================================
         HEADER
    ================================================== -->

    <div style="
        display:flex;
        align-items:center;
        gap:14px;
        margin-bottom:25px;
    ">


        <button
            type="button"
            onclick="goHome()"

            style="
                width:42px;
                height:42px;
                flex-shrink:0;
                border:none;
                border-radius:12px;
                background:#ffffff;
                color:#1267d9;
                display:flex;
                align-items:center;
                justify-content:center;
                cursor:pointer;
                box-shadow:0 5px 15px rgba(20,45,90,0.08);
                padding:0;
            "
        >

            <i
                class="bi bi-arrow-left"
                style="font-size:20px;"
            ></i>

        </button>


        <div>

            <h2 style="
                margin:0;
                font-size:22px;
                line-height:1.2;
                font-weight:700;
                color:#071b3a;
            ">
                Printer Parts
            </h2>


            <p style="
                margin:5px 0 0;
                font-size:13px;
                color:#71809a;
            ">
                Find the right parts for your printer
            </p>

        </div>

    </div>



    <!-- =================================================
         SEARCH
    ================================================== -->

    <div style="
        background:#ffffff;
        border-radius:16px;
        padding:14px;
        margin-bottom:18px;
        box-shadow:0 5px 18px rgba(20,45,90,0.05);
    ">


        <div style="
            position:relative;
        ">

            <i
                class="bi bi-search"
                style="
                    position:absolute;
                    left:14px;
                    top:50%;
                    transform:translateY(-50%);
                    color:#8793a7;
                    font-size:16px;
                "
            ></i>


            <input
                id="searchInput"
                type="text"
                placeholder="Search printer parts..."
                oninput="filterParts()"

                style="
                    width:100%;
                    height:44px;
                    box-sizing:border-box;
                    border:1px solid #dfe6ef;
                    border-radius:11px;
                    background:#fafcff;
                    padding:0 12px 0 40px;
                    font-size:13px;
                    color:#172033;
                    outline:none;
                "
            >

        </div>

    </div>



    <!-- =================================================
         CATEGORIES
    ================================================== -->

    <div style="
        display:flex;
        gap:8px;
        overflow-x:auto;
        scrollbar-width:none;
        margin-bottom:22px;
    ">


        <button
            onclick="selectCategory('All',this)"
            class="category-btn active"
        >
            All
        </button>


        <button
            onclick="selectCategory('Ink',this)"
            class="category-btn"
        >
            Ink
        </button>


        <button
            onclick="selectCategory('Toner',this)"
            class="category-btn"
        >
            Toner
        </button>


        <button
            onclick="selectCategory('Cartridge',this)"
            class="category-btn"
        >
            Cartridge
        </button>


        <button
            onclick="selectCategory('Drum',this)"
            class="category-btn"
        >
            Drum
        </button>


        <button
            onclick="selectCategory('Accessories',this)"
            class="category-btn"
        >
            Accessories
        </button>

    </div>



    <!-- =================================================
         SECTION TITLE
    ================================================== -->

    <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:12px;
    ">

        <h3 style="
            margin:0;
            font-size:17px;
            font-weight:700;
            color:#071b3a;
        ">
            Printer Parts
        </h3>


        <span
            id="productCount"

            style="
                font-size:11px;
                color:#7c889c;
            "
        >
            8 parts
        </span>

    </div>



    <!-- =================================================
         PRODUCTS
    ================================================== -->

    <div
        id="partsContainer"

        style="
            display:flex;
            flex-direction:column;
            gap:12px;
        "
    >
    </div>


</div>



<!-- =====================================================
     FLOATING CART BUTTON
===================================================== -->

<button
    onclick="openCart()"

    style="
        position:fixed;
        right:calc(50% - 228px);
        bottom:88px;
        width:50px;
        height:50px;
        border:none;
        border-radius:50%;
        background:linear-gradient(135deg,#1267d9,#0750b5);
        color:#ffffff;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        box-shadow:0 7px 20px rgba(18,103,217,0.28);
        z-index:900;
    "
>

    <i
        class="bi bi-cart3"
        style="font-size:20px;"
    ></i>


    <span
        id="cartCount"

        style="
            position:absolute;
            top:-4px;
            right:-3px;
            min-width:18px;
            height:18px;
            border-radius:50%;
            background:#ef4444;
            color:#ffffff;
            font-size:9px;
            font-weight:bold;
            display:flex;
            align-items:center;
            justify-content:center;
        "
    >
        0
    </span>

</button>



<!-- =====================================================
     CART OVERLAY
===================================================== -->

<div
    id="cartOverlay"
    onclick="closeCart()"

    style="
        display:none;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,0.35);
        z-index:2000;
    "
>
</div>



<!-- =====================================================
     CART PANEL
===================================================== -->

<div
    id="cartPanel"

    style="
        position:fixed;
        bottom:0;
        left:50%;
        transform:translateX(-50%) translateY(110%);
        width:100%;
        max-width:504px;
        background:#ffffff;
        border-radius:22px 22px 0 0;
        z-index:2100;
        box-shadow:0 -8px 30px rgba(20,45,90,0.15);
        transition:transform 0.3s ease;
    "
>


    <!-- CART HEADER -->

    <div style="
        padding:18px;
        border-bottom:1px solid #edf0f4;
        display:flex;
        justify-content:space-between;
        align-items:center;
    ">


        <div>

            <h3 style="
                margin:0;
                font-size:18px;
            ">
                Your Cart
            </h3>


            <span
                id="cartItemsCount"

                style="
                    font-size:11px;
                    color:#7c889c;
                "
            >
                0 items
            </span>

        </div>


        <button
            onclick="closeCart()"

            style="
                width:35px;
                height:35px;
                border:none;
                border-radius:10px;
                background:#f1f4f8;
                cursor:pointer;
            "
        >

            <i class="bi bi-x-lg"></i>

        </button>

    </div>



    <!-- CART ITEMS -->

    <div
        id="cartItems"

        style="
            max-height:300px;
            overflow-y:auto;
            padding:0 18px;
        "
    >
    </div>



    <!-- CART FOOTER -->

    <div style="
        padding:18px;
        border-top:1px solid #edf0f4;
    ">


        <div style="
            display:flex;
            justify-content:space-between;
            margin-bottom:13px;
        ">

            <span style="
                font-size:13px;
                color:#758197;
            ">
                Total
            </span>


            <strong
                id="cartTotal"

                style="
                    color:#1267d9;
                    font-size:18px;
                "
            >
                ₹0
            </strong>

        </div>


        <button
            onclick="checkout()"

            style="
                width:100%;
                height:48px;
                border:none;
                border-radius:11px;
                background:#1267d9;
                color:#ffffff;
                font-size:13px;
                font-weight:700;
                cursor:pointer;
            "
        >

            Proceed to Checkout

            <i
                class="bi bi-arrow-right"
                style="margin-left:5px;"
            ></i>

        </button>

    </div>

</div>



<!-- =====================================================
     BOTTOM NAVIGATION
===================================================== -->

<div style="
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:504px;
    height:68px;
    background:#ffffff;
    border-top:1px solid #e7ebf1;
    box-shadow:0 -4px 15px rgba(20,45,90,0.05);
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:space-around;
">


    <a
        href="index.html"
        class="bottom-link"
    >

        <i class="bi bi-house"></i>

        <span>
            Home
        </span>

    </a>


    <a
        href="current-order.html"
        class="bottom-link"
    >

        <i class="bi bi-truck"></i>

        <span>
            Current Orders
        </span>

    </a>


    <a
        href="history.html"
        class="bottom-link"
    >

        <i class="bi bi-clock-history"></i>

        <span>
            History
        </span>

    </a>


    <a
        href="profile.html"
        class="bottom-link"
    >

        <i class="bi bi-person"></i>

        <span>
            Profile
        </span>

    </a>

</div>



<script>


/* =====================================================
   PRODUCT DATA
===================================================== */

const parts = [

    {
        id:1,
        name:"HP Black Ink Cartridge",
        category:"Ink",
        brand:"HP",
        compatible:"HP DeskJet 2720",
        price:850,
        icon:"bi-droplet-fill",
        description:
            "Original quality black ink cartridge suitable for HP DeskJet printers."
    },

    {
        id:2,
        name:"Canon Black Ink Cartridge",
        category:"Cartridge",
        brand:"Canon",
        compatible:"Canon Pixma E410",
        price:720,
        icon:"bi-droplet",
        description:
            "Reliable black ink cartridge designed for compatible Canon Pixma printers."
    },

    {
        id:3,
        name:"Epson Black Ink Bottle",
        category:"Ink",
        brand:"Epson",
        compatible:"Epson L3110 / L3150",
        price:590,
        icon:"bi-droplet-fill",
        description:
            "High quality black ink bottle for compatible Epson EcoTank printers."
    },

    {
        id:4,
        name:"HP 88A Black Toner",
        category:"Toner",
        brand:"HP",
        compatible:"HP LaserJet Pro",
        price:1450,
        icon:"bi-printer-fill",
        description:
            "Black toner cartridge for compatible HP LaserJet printers."
    },

    {
        id:5,
        name:"Canon Black Toner",
        category:"Toner",
        brand:"Canon",
        compatible:"Canon LBP6030",
        price:1350,
        icon:"bi-printer",
        description:
            "High quality toner cartridge for compatible Canon laser printers."
    },

    {
        id:6,
        name:"Printer Drum Unit",
        category:"Drum",
        brand:"HP",
        compatible:"HP LaserJet Series",
        price:2100,
        icon:"bi-circle",
        description:
            "Replacement drum unit designed for compatible HP LaserJet printers."
    },

    {
        id:7,
        name:"Paper Pickup Roller",
        category:"Accessories",
        brand:"Universal",
        compatible:"Multiple HP Models",
        price:450,
        icon:"bi-record-circle",
        description:
            "Replacement paper pickup roller for compatible printer models."
    },

    {
        id:8,
        name:"Printer Cleaning Kit",
        category:"Accessories",
        brand:"Printer Pro",
        compatible:"Universal",
        price:350,
        icon:"bi-tools",
        description:
            "Printer cleaning kit for maintaining printer performance."
    }

];



/* =====================================================
   CART
===================================================== */

let cart =
    JSON.parse(
        localStorage.getItem(
            "printerProPartsCart"
        )
    ) || [];


let selectedCategory = "All";



/* =====================================================
   DISPLAY PRODUCTS
===================================================== */

function displayParts(list) {

    const container =
        document.getElementById(
            "partsContainer"
        );


    container.innerHTML = "";


    document.getElementById(
        "productCount"
    ).innerText =
        list.length + " parts";


    list.forEach(part => {

        const card =
            document.createElement("div");


        card.style.cssText = `

            width:100%;

            box-sizing:border-box;

            background:#ffffff;

            border-radius:16px;

            padding:14px;

            box-shadow:
                0 5px 18px
                rgba(20,45,90,0.05);

            display:flex;

            align-items:center;

            gap:12px;

        `;


        card.innerHTML = `


            <!-- =========================================
                 PRODUCT ICON
            ========================================== -->

            <div style="
                width:55px;
                height:55px;
                flex-shrink:0;
                border-radius:14px;
                background:#edf5ff;
                color:#1267d9;
                display:flex;
                align-items:center;
                justify-content:center;
            ">

                <i
                    class="bi ${part.icon}"
                    style="font-size:25px;"
                ></i>

            </div>



            <!-- =========================================
                 PRODUCT INFORMATION
            ========================================== -->

            <div style="
                flex:1;
                min-width:0;
            ">


                <div style="
                    font-size:10px;
                    color:#1267d9;
                    font-weight:700;
                    margin-bottom:3px;
                ">
                    ${part.category}
                </div>


                <h4 style="
                    margin:0;
                    font-size:14px;
                    font-weight:700;
                    color:#071b3a;
                    line-height:1.3;
                ">
                    ${part.name}
                </h4>


                <p style="
                    margin:4px 0 7px;
                    font-size:10px;
                    color:#7b8798;
                    white-space:nowrap;
                    overflow:hidden;
                    text-overflow:ellipsis;
                ">
                    ${part.compatible}
                </p>


                <strong style="
                    display:block;
                    font-size:15px;
                    color:#1267d9;
                ">
                    ₹${part.price.toLocaleString("en-IN")}
                </strong>


            </div>



            <!-- =========================================
                 RIGHT SIDE BUTTONS
            ========================================== -->

            <div style="
                width:78px;
                flex-shrink:0;
                display:flex;
                flex-direction:column;
                gap:7px;
            ">


                <!-- DETAILS -->

                <button
                    type="button"
                    onclick="viewProductDetails(${part.id})"

                    style="
                        width:100%;
                        height:31px;
                        border:1px solid #1267d9;
                        border-radius:8px;
                        background:#ffffff;
                        color:#1267d9;
                        font-size:10px;
                        font-weight:700;
                        cursor:pointer;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        gap:4px;
                        padding:0;
                    "
                >

                    <i class="bi bi-eye"></i>

                    Details

                </button>



                <!-- ADD -->

                <button
                    type="button"
                    onclick="addToCart(${part.id})"

                    style="
                        width:100%;
                        height:31px;
                        border:none;
                        border-radius:8px;
                        background:#1267d9;
                        color:#ffffff;
                        font-size:10px;
                        font-weight:700;
                        cursor:pointer;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        gap:4px;
                        padding:0;
                    "
                >

                    <i class="bi bi-cart-plus"></i>

                    Add

                </button>


            </div>

        `;


        container.appendChild(card);

    });

}



/* =====================================================
   VIEW PRODUCT DETAILS
===================================================== */

function viewProductDetails(id) {

    localStorage.setItem(
        "selectedPrinterPart",
        id
    );


    window.location.href =
        "product-details.html";

}



/* =====================================================
   SEARCH
===================================================== */

function filterParts() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase();


    const filtered =
        parts.filter(part => {


            const matchesSearch =

                part.name
                    .toLowerCase()
                    .includes(search)

                ||

                part.brand
                    .toLowerCase()
                    .includes(search)

                ||

                part.compatible
                    .toLowerCase()
                    .includes(search);


            const matchesCategory =

                selectedCategory === "All"

                ||

                part.category ===
                    selectedCategory;


            return (
                matchesSearch &&
                matchesCategory
            );

        });


    displayParts(filtered);

}



/* =====================================================
   CATEGORY
===================================================== */

function selectCategory(
    category,
    button
) {

    selectedCategory =
        category;


    document
        .querySelectorAll(
            ".category-btn"
        )
        .forEach(btn => {

            btn.classList.remove(
                "active"
            );

        });


    button.classList.add(
        "active"
    );


    filterParts();

}



/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(id) {

    const product =
        parts.find(
            p => p.id === id
        );


    if(!product) {

        return;

    }


    const existing =
        cart.find(
            p => p.id === id
        );


    if(existing) {

        existing.quantity++;

    }
    else {

        cart.push({

            id:product.id,

            name:product.name,

            price:product.price,

            quantity:1

        });

    }


    saveCart();

    updateCart();

    openCart();

}



/* =====================================================
   SAVE CART
===================================================== */

function saveCart() {

    localStorage.setItem(
        "printerProPartsCart",
        JSON.stringify(cart)
    );

}



/* =====================================================
   UPDATE CART
===================================================== */

function updateCart() {

    let total = 0;

    let count = 0;


    const container =
        document.getElementById(
            "cartItems"
        );


    container.innerHTML = "";


    cart.forEach(item => {

        count += item.quantity;


        total +=
            item.price *
            item.quantity;


        const row =
            document.createElement(
                "div"
            );


        row.style.cssText = `

            padding:14px 0;

            border-bottom:
                1px solid #edf0f4;

        `;


        row.innerHTML = `

            <div style="
                display:flex;
                justify-content:space-between;
                gap:10px;
            ">

                <strong style="
                    font-size:12px;
                ">
                    ${item.name}
                </strong>


                <strong style="
                    color:#1267d9;
                    font-size:12px;
                    white-space:nowrap;
                ">
                    ₹${(
                        item.price *
                        item.quantity
                    ).toLocaleString("en-IN")}
                </strong>

            </div>


            <div style="
                display:flex;
                align-items:center;
                gap:8px;
                margin-top:8px;
            ">


                <button
                    onclick="changeQuantity(${item.id},-1)"

                    style="
                        width:26px;
                        height:26px;
                        border:1px solid #dce3ec;
                        border-radius:7px;
                        background:#ffffff;
                        cursor:pointer;
                    "
                >
                    −
                </button>


                <span style="
                    font-size:12px;
                    min-width:12px;
                    text-align:center;
                ">
                    ${item.quantity}
                </span>


                <button
                    onclick="changeQuantity(${item.id},1)"

                    style="
                        width:26px;
                        height:26px;
                        border:none;
                        border-radius:7px;
                        background:#1267d9;
                        color:#ffffff;
                        cursor:pointer;
                    "
                >
                    +
                </button>


                <button
                    onclick="removeFromCart(${item.id})"

                    style="
                        margin-left:auto;
                        border:none;
                        background:transparent;
                        color:#e05252;
                        cursor:pointer;
                    "
                >

                    <i class="bi bi-trash"></i>

                </button>


            </div>

        `;


        container.appendChild(row);

    });


    if(cart.length === 0) {

        container.innerHTML = `

            <div style="
                padding:35px 10px;
                text-align:center;
                color:#8792a4;
                font-size:12px;
            ">

                <i
                    class="bi bi-cart-x"
                    style="
                        display:block;
                        font-size:28px;
                        margin-bottom:8px;
                    "
                ></i>

                Your cart is empty.

            </div>

        `;

    }


    document.getElementById(
        "cartCount"
    ).innerText = count;


    document.getElementById(
        "cartItemsCount"
    ).innerText =
        count +
        (
            count === 1
                ? " item"
                : " items"
        );


    document.getElementById(
        "cartTotal"
    ).innerText =
        "₹" +
        total.toLocaleString(
            "en-IN"
        );

}



/* =====================================================
   CHANGE QUANTITY
===================================================== */

function changeQuantity(
    id,
    amount
) {

    const item =
        cart.find(
            p => p.id === id
        );


    if(!item) {

        return;

    }


    item.quantity += amount;


    if(item.quantity <= 0) {

        cart =
            cart.filter(
                p => p.id !== id
            );

    }


    saveCart();

    updateCart();

}



/* =====================================================
   REMOVE FROM CART
===================================================== */

function removeFromCart(id) {

    cart =
        cart.filter(
            item => item.id !== id
        );


    saveCart();

    updateCart();

}



/* =====================================================
   OPEN CART
===================================================== */

function openCart() {

    updateCart();


    document.getElementById(
        "cartOverlay"
    ).style.display =
        "block";


    document.getElementById(
        "cartPanel"
    ).style.transform =
        "translateX(-50%) translateY(0)";

}



/* =====================================================
   CLOSE CART
===================================================== */

function closeCart() {

    document.getElementById(
        "cartOverlay"
    ).style.display =
        "none";


    document.getElementById(
        "cartPanel"
    ).style.transform =
        "translateX(-50%) translateY(110%)";

}



/* =====================================================
   CHECKOUT
===================================================== */

function checkout() {

    if(cart.length === 0) {

        alert(
            "Your cart is empty."
        );

        return;

    }


    localStorage.setItem(
        "printerProPartsOrder",
        JSON.stringify(cart)
    );


    window.location.href =
        "checkout.html";

}



/* =====================================================
   BACK TO HOME
===================================================== */

function goHome() {

    window.location.href =
        "index.html";

}



/* =====================================================
   INITIAL LOAD
===================================================== */

displayParts(parts);

updateCart();


</script>



<style>

/* =====================================================
   CATEGORY BUTTONS
===================================================== */

.category-btn {

    flex-shrink:0;

    border:1px solid #dce3ec;

    background:#ffffff;

    color:#68758a;

    border-radius:20px;

    padding:8px 14px;

    font-size:11px;

    font-weight:600;

    cursor:pointer;

}


.category-btn.active {

    background:#1267d9;

    color:#ffffff;

    border-color:#1267d9;

}



/* =====================================================
