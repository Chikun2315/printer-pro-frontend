<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Printer Pro - Add Printer</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

    <!-- Existing CSS -->
    <link
        rel="stylesheet"
        href="style.css">


    <!-- =========================================
         ADD PRINTER PAGE CSS
    ========================================== -->

    <style>

        .add-printer-page {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 20px 16px 40px;
            background: #f5f8fc;
        }


        /* HEADER */

        .add-printer-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }


        .add-printer-back {
            width: 44px;
            height: 44px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;
            color: #1264d6;

            border-radius: 13px;

            text-decoration: none;

            box-shadow:
                0 5px 18px rgba(24, 39, 75, 0.08);
        }


        .add-printer-back i {
            font-size: 21px;
        }


        .add-printer-header-text h4 {
            margin: 0 0 4px;

            font-size: 23px;
            font-weight: 700;

            color: #172033;
        }


        .add-printer-header-text p {
            margin: 0;

            font-size: 13px;
            color: #7f899a;
        }


        /* INFORMATION HEADER */

        .printer-info-header {
            display: flex;
            align-items: center;
            gap: 13px;

            margin-bottom: 18px;
        }


        .printer-info-icon {
            width: 48px;
            height: 48px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eaf3ff;
            color: #1264d6;

            border-radius: 14px;
        }


        .printer-info-icon i {
            font-size: 22px;
        }


        .printer-info-text h5 {
            margin: 0 0 4px;

            font-size: 17px;
            font-weight: 700;

            color: #172033;
        }


        .printer-info-text p {
            margin: 0;

            font-size: 12px;

            color: #8993a5;
        }


        /* FORM CARD */

        .add-printer-form-card {
            width: 100%;

            padding: 22px;

            background: #ffffff;

            border: 1px solid #edf1f7;

            border-radius: 18px;

            box-shadow:
                0 6px 22px rgba(24, 39, 75, 0.07);
        }


        /* FORM GROUP */

        .add-printer-field {
            width: 100%;
            margin-bottom: 18px;
        }


        .add-printer-field:last-of-type {
            margin-bottom: 22px;
        }


        .add-printer-field label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 600;

            color: #30394a;
        }


        /* INPUTS */

        .add-printer-field input,
        .add-printer-field select {

            width: 100%;

            height: 50px;

            display: block;

            padding: 0 14px;

            border: 1px solid #dce3ec;

            border-radius: 11px;

            background: #ffffff;

            color: #172033;

            font-size: 13px;

            outline: none;

            box-shadow: none;

            appearance: auto;
        }


        .add-printer-field input::placeholder {
            color: #a0a8b5;
        }


        .add-printer-field input:focus,
        .add-printer-field select:focus {

            border-color: #1264d6;

            box-shadow:
                0 0 0 3px rgba(18, 100, 214, 0.10);

        }


        /* SAVE BUTTON */

        .add-printer-save {

            width: 100%;

            height: 52px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            border: none;

            border-radius: 11px;

            background: #1264d6;

            color: #ffffff;

            font-size: 14px;

            font-weight: 700;

            text-decoration: none;

            box-shadow:
                0 7px 18px rgba(18, 100, 214, 0.20);

            transition: 0.2s ease;
        }


        .add-printer-save:hover {

            background: #0758bd;

            color: #ffffff;

            transform: translateY(-1px);
        }


        .add-printer-save i {
            font-size: 16px;
        }


        /* SAFETY CARD */

        .printer-safe {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-top: 16px;

            padding: 14px;

            background: #edf7ff;

            border: 1px solid #d7eaff;

            border-radius: 15px;
        }


        .printer-safe-icon {

            width: 38px;
            height: 38px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #ffffff;

            color: #1264d6;

            border-radius: 10px;
        }


        .printer-safe-icon i {
            font-size: 18px;
        }


        .printer-safe-text strong {

            display: block;

            margin-bottom: 3px;

            font-size: 12px;

            color: #172033;
        }


        .printer-safe-text p {

            margin: 0;

            font-size: 10px;

            line-height: 1.4;

            color: #7b8798;
        }


        /* MOBILE */

        @media (max-width: 576px) {

            .add-printer-page {

                padding:
                    18px
                    14px
                    35px;
            }


            .add-printer-header {

                margin-bottom: 24px;
            }


            .add-printer-header-text h4 {

                font-size: 21px;
            }


            .add-printer-form-card {

                padding: 18px;

                border-radius: 17px;
            }


            .add-printer-field {

                margin-bottom: 16px;
            }


            .add-printer-field input,
            .add-printer-field select {

                height: 49px;
            }

        }

    </style>

</head>


<body>


    <div class="add-printer-page">


        <!-- =================================
             HEADER
        ================================== -->

        <div class="add-printer-header">

            <a
                href="select-printer.html"
                class="add-printer-back">

                <i class="bi bi-arrow-left"></i>

            </a>


            <div class="add-printer-header-text">

                <h4>
                    Add Printer
                </h4>

                <p>
                    Add your printer details
                </p>

            </div>

        </div>



        <!-- =================================
             PRINTER INFORMATION
        ================================== -->

        <div class="printer-info-header">


            <div class="printer-info-icon">

                <i class="bi bi-printer"></i>

            </div>


            <div class="printer-info-text">

                <h5>
                    Printer Information
                </h5>

                <p>
                    Enter the details of your printer
                </p>

            </div>

        </div>



        <!-- =================================
             FORM CARD
        ================================== -->

        <div class="add-printer-form-card">


            <!-- BRAND -->

            <div class="add-printer-field">

                <label for="printerBrand">
                    Printer Brand
                </label>

                <select
                    id="printerBrand">

                    <option
                        value=""
                        selected
                        disabled>

                        Select Brand

                    </option>

                    <option value="HP">
                        HP
                    </option>

                    <option value="Canon">
                        Canon
                    </option>

                    <option value="Epson">
                        Epson
                    </option>

                    <option value="Brother">
                        Brother
                    </option>

                </select>

            </div>



            <!-- MODEL -->

            <div class="add-printer-field">

                <label for="printerModel">
                    Printer Model
                </label>

                <input
                    id="printerModel"
                    type="text"
                    placeholder="Enter printer model">

            </div>



            <!-- SERIAL NUMBER -->

            <div class="add-printer-field">

                <label for="serialNumber">
                    Serial Number
                </label>

                <input
                    id="serialNumber"
                    type="text"
                    placeholder="Enter serial number">

            </div>



            <!-- PRINTER TYPE -->

            <div class="add-printer-field">

                <label for="printerType">
                    Printer Type
                </label>

                <select id="printerType">

                    <option
                        value=""
                        selected
                        disabled>

                        Select printer type

                    </option>

                    <option value="Inkjet">
                        Inkjet
                    </option>

                    <option value="Laser">
                        Laser
                    </option>

                    <option value="Multifunction">
                        Multifunction
                    </option>

                </select>

            </div>



            <!-- SAVE -->

            <a
                href="repair-problem.html"
                class="add-printer-save">

                <span>
                    Save Printer
                </span>

                <i class="bi bi-arrow-right"></i>

            </a>

        </div>



        <!-- =================================
             SAFETY INFORMATION
        ================================== -->

        <div class="printer-safe">


            <div class="printer-safe-icon">

                <i class="bi bi-shield-check"></i>

            </div>


            <div class="printer-safe-text">

                <strong>
                    Your information is safe
                </strong>

                <p>
                    Printer details are used only to provide the right repair service.
                </p>

            </div>

        </div>


    </div>


</body>

</html>
