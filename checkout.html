<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Printer Pro - Checkout</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<div class="page-container">

    <div class="simple-header">

        <a href="cart.html" class="back-btn">
            <i class="bi bi-arrow-left"></i>
        </a>

        <div>

            <h4>Checkout</h4>

            <p>
                Confirm your order
            </p>

        </div>

    </div>


    <div class="checkout-section">

        <div class="checkout-section-header">

            <h6>
                Delivery Address
            </h6>

            <a href="addresses.html">
                Change
            </a>

        </div>


        <div class="checkout-address">

            <i class="bi bi-house-fill"></i>

            <div>

                <strong>
                    Home
                </strong>

                <p>
                    123 Example Street,
                    Bhubaneswar, Odisha
                </p>

            </div>

        </div>

    </div>


    <div class="checkout-section">

        <h6>
            Order Summary
        </h6>

        <div class="checkout-row">

            <span>
                HP 12A Toner
            </span>

            <strong>
                ₹1,250
            </strong>

        </div>

        <div class="checkout-row">

            <span>
                Delivery
            </span>

            <strong>
                ₹50
            </strong>

        </div>

        <hr>

        <div class="checkout-total">

            <span>
                Total
            </span>

            <strong>
                ₹1,300
            </strong>

        </div>

    </div>


    <a
        href="payment.html"
        class="btn btn-primary w-100">

        Continue to Payment

    </a>

</div>

<script src="app.js"></script>

</body>
</html>
