<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Printer Pro - Payment Methods</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f8fc;
            font-family: Arial, Helvetica, sans-serif;
            color: #172033;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .payment-page {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            margin: auto;
            padding: 20px 16px 90px;
            background: #f5f8fc;
        }

        /* HEADER */

        .page-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 25px;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #1264d6;
            border-radius: 13px;
            box-shadow: 0 5px 18px rgba(24,39,75,.08);
        }

        .back-btn i {
            font-size: 20px;
        }

        .page-header h4 {
            margin: 0 0 4px;
            font-size: 22px;
            font-weight: 700;
        }

        .page-header p {
            margin: 0;
            font-size: 13px;
            color: #7d8798;
        }

        /* TITLE */

        .section-title {
            margin-bottom: 14px;
        }

        .section-title h5 {
            margin: 0 0 4px;
            font-size: 17px;
        }

        .section-title p {
            margin: 0;
            font-size: 12px;
            color: #8993a4;
        }

        /* PAYMENT CARD */

        .payment-card {
            background: #ffffff;
            border: 1px solid #e5eaf1;
            border-radius: 18px;
            padding: 17px;
            margin-bottom: 13px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 5px 18px rgba(24,39,75,.05);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #eaf2ff;
            color: #1264d6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .card-info {
            flex: 1;
        }

        .card-info strong {
            display: block;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .card-info span {
            font-size: 12px;
            color: #7d8798;
        }

        .default-badge {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 8px;
            border-radius: 20px;
            background: #e9f8ef;
            color: #1b9b62;
            font-size: 9px;
            font-weight: 700;
        }

        .delete-btn {
            border: none;
            background: #fff0f0;
            color: #dc3545;
            width: 38px;
            height: 38px;
            border-radius: 11px;
            cursor: pointer;
        }

        /* ADD PAYMENT */

        .add-payment {
            width: 100%;
            height: 52px;
            border: 1.5px dashed #b9c9df;
            border-radius: 14px;
            background: #f8fbff;
            color: #1264d6;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 8px;
        }

        .add-payment i {
            font-size: 18px;
        }

        /* INFO */

        .info-card {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding: 14px;
            background: #edf6ff;
            border: 1px solid #dcecff;
            border-radius: 14px;
        }

        .info-card i {
            color: #1264d6;
            font-size: 18px;
        }

        .info-card p {
            margin: 0;
            font-size: 11px;
            line-height: 1.5;
            color: #718096;
        }

    </style>

</head>

<body>

<div class="payment-page">

    <!-- HEADER -->

    <div class="page-header">

        <a href="profile.html" class="back-btn">
            <i class="bi bi-arrow-left"></i>
        </a>

        <div>
            <h4>Payment Methods</h4>
            <p>Manage your saved payment methods</p>
        </div>

    </div>

    <!-- TITLE -->

    <div class="section-title">

        <h5>Saved Payment Methods</h5>

        <p>Select a payment method during checkout</p>

    </div>

    <!-- CARD 1 -->

    <div class="payment-card">

        <div class="card-icon">
            <i class="bi bi-credit-card"></i>
        </div>

        <div class="card-info">

            <strong>Visa •••• 4242</strong>

            <span>Expires 08/28</span>

            <div class="default-badge">
                DEFAULT
            </div>

        </div>

        <button class="delete-btn"
                onclick="deletePayment()">

            <i class="bi bi-trash"></i>

        </button>

    </div>

    <!-- CARD 2 -->

    <div class="payment-card">

        <div class="card-icon">
            <i class="bi bi-credit-card-2-front"></i>
        </div>

        <div class="card-info">

            <strong>Mastercard •••• 7812</strong>

            <span>Expires 03/29</span>

        </div>

        <button class="delete-btn"
                onclick="deletePayment()">

            <i class="bi bi-trash"></i>

        </button>

    </div>

    <!-- ADD PAYMENT -->

    <a href="#"
       class="add-payment"
       onclick="addPayment(event)">

        <i class="bi bi-plus-circle"></i>

        Add New Payment Method

    </a>

    <!-- INFO -->

    <div class="info-card">

        <i class="bi bi-shield-lock"></i>

        <p>
            Your payment information is securely stored and will only be used for order payments.
        </p>

    </div>

</div>

<script>

    function deletePayment() {

        alert("Payment method deleted.");

    }

    function addPayment(event) {

        event.preventDefault();

        alert("Add Payment Method screen will be implemented next.");

    }

</script>

</body>

</html>
