<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Printer Pro - Personal Information</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<div class="personal-page">

    <!-- HEADER -->

    <div class="personal-header">

        <a href="profile.html" class="personal-back-btn">
            <i class="bi bi-arrow-left"></i>
        </a>

        <div>
            <h4>Personal Information</h4>
            <p>Manage your personal details</p>
        </div>

    </div>


    <!-- PROFILE ICON -->

    <div class="personal-profile">

        <div class="personal-avatar">
            <i class="bi bi-person"></i>
        </div>

        <h5>Admin</h5>

        <p>Printer Pro Customer</p>

    </div>


    <!-- FORM -->

    <div class="personal-card">

        <div class="personal-field">

            <label>Full Name</label>

            <div class="personal-input">

                <i class="bi bi-person"></i>

                <input
                    type="text"
                    value="Admin"
                    placeholder="Enter your name">

            </div>

        </div>


        <div class="personal-field">

            <label>Email Address</label>

            <div class="personal-input">

                <i class="bi bi-envelope"></i>

                <input
                    type="email"
                    value="admin@example.com"
                    placeholder="Enter your email">

            </div>

        </div>


        <div class="personal-field">

            <label>Mobile Number</label>

            <div class="personal-input">

                <i class="bi bi-phone"></i>

                <input
                    type="tel"
                    value="+91 9876543210"
                    placeholder="Enter mobile number">

            </div>

        </div>
        <div class="personal-field">

            <label>User ID</label>

            <div class="personal-input">

                <i class="bi bi-person"></i>

                <input
                    type="text"
                    value="Admin"
                    placeholder="Enter your name">

            </div>

        </div>

        <div class="personal-field">

            <label>Date of Birth</label>

            <div class="personal-input">

                <i class="bi bi-calendar"></i>

                <input
                    type="date">

            </div>

        </div>


        <button
            class="personal-save-btn"
            onclick="savePersonalInfo()">

            <i class="bi bi-check-circle"></i>

            Save Changes

        </button>

    </div>


    <!-- INFORMATION -->

    <div class="personal-info-box">

        <div class="personal-info-icon">

            <i class="bi bi-shield-check"></i>

        </div>

        <div>

            <strong>Your information is secure</strong>

            <p>
                Your personal information is stored securely
                and is only used to provide better services.
            </p>

        </div>

    </div>

</div>


<script>

function savePersonalInfo() {

    alert("Personal information updated successfully.");

}

</script>

</body>

</html>
