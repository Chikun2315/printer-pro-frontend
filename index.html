<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Printer Pro</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">


    <!-- Printer Pro CSS -->

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


    <!-- =================================
         SPLASH SCREEN
    ================================== -->

    <div class="splash-screen">


        <div class="splash-content">


            <!-- PRINTER ICON -->

            <div class="printer-logo">

                <i class="bi bi-printer-fill"></i>

            </div>


            <!-- APP NAME -->

            <h1>

                PRINTER <span>PRO</span>

            </h1>


            <!-- TAGLINE -->

            <p class="tagline">

                REPAIR <span>•</span> PARTS <span>•</span> INK

            </p>


            <!-- DESCRIPTION -->

            <p class="description">

                One App for All Printer Needs

            </p>


            <!-- LOADING DOTS -->

            <div class="loading-dots">

                <span></span>
                <span></span>
                <span></span>

            </div>


            <!-- GET STARTED -->

            <button
                class="btn get-started-btn"
                onclick="goToLogin()">

                Get Started

                <i class="bi bi-arrow-right"></i>

            </button>


            <!-- TRUST -->

            <p class="trusted">

                <i class="bi bi-shield-check"></i>

                Trusted • Reliable • Fast

            </p>


        </div>


    </div>



    <!-- JavaScript -->

    <script src="app.js"></script>


</body>

</html>
