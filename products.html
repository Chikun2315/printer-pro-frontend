<script>


/* ================================================
   BACK TO HOME
================================================ */

function goHome() {

    window.location.href = "home.html";

}



/* ================================================
   SEARCH PRODUCTS
================================================ */

function searchProducts() {

    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    const products =
        document.querySelectorAll(
            ".product-item"
        );


    let visibleCount = 0;


    products.forEach(product => {

        const name =
            product
                .dataset
                .name
                .toLowerCase();


        if(name.includes(search)) {

            product.style.display =
                "block";

            visibleCount++;

        }
        else {

            product.style.display =
                "none";

        }

    });


    document.getElementById(
        "productCount"
    ).innerText =
        visibleCount + " products";

}



/* ================================================
   VIEW PRODUCT
================================================ */

function viewProduct(productName) {

    localStorage.setItem(
        "selectedProduct",
        productName
    );


    window.location.href =
        "product-details.html";

}



/* ================================================
   ADD TO CART
================================================ */

function addToCart(
    productName,
    price
) {

    let cart =
        JSON.parse(
            localStorage.getItem(
                "printerProCart"
            )
        ) || [];


    const existing =
        cart.find(
            item =>
                item.name === productName
        );


    if(existing) {

        existing.quantity++;

    }
    else {

        cart.push({

            name:productName,

            price:price,

            quantity:1

        });

    }


    localStorage.setItem(
        "printerProCart",
        JSON.stringify(cart)
    );


    alert(
        productName +
        " added to cart."
    );

}

</script>
